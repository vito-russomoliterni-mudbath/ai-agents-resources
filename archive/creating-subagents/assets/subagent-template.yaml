# Sub-agent Configuration Template (YAML)
# Location: .claude/agents/[name].yaml (project) or ~/.claude/agents/[name].yaml (personal)
#
# Instructions:
# 1. Replace [placeholders] with actual values
# 2. Remove comments and unused optional fields
# 3. Save with .yaml extension

# =============================================================================
# REQUIRED FIELDS
# =============================================================================

# Unique identifier (lowercase kebab-case, 1-64 chars)
name: [agent-name]

# When to delegate to this agent (1-1024 chars)
# Format: "[Handles X]. Use when [condition]."
description: |
  [What this agent handles]. Use when [trigger conditions or phrases].

# System prompt defining role and behavior
prompt: |
  You are a [role] specialist. Your role is to:
  - [Capability 1]
  - [Capability 2]
  - [Capability 3]

  Constraints:
  - [Constraint 1]
  - [Constraint 2]

  Output format:
  - [Format guideline if applicable]

# =============================================================================
# OPTIONAL FIELDS
# =============================================================================

# Model selection (remove to inherit from parent)
# Options: haiku (fast/cheap), sonnet (balanced), opus (powerful)
# model: sonnet

# Tools to allow (remove to allow all tools)
# Common tools: Read, Write, Edit, Grep, Glob, Bash, WebSearch, WebFetch
# MCP tools: mcp__servername__toolname
# tools:
#   - Read
#   - Grep
#   - Glob
#   - Bash
#   - Edit
#   - Write
#   - mcp__github__create_pull_request

# Tools to explicitly deny (alternative to tools whitelist)
# disallowedTools:
#   - Write
#   - Edit

# Permission mode
# Options: plan (read-only), default (prompts), acceptEdits (auto-accept files),
#          dontAsk (skip prompts), bypassPermissions (full access)
# permissionMode: default

# Skills to preload at startup
# skills:
#   - fixing-bugs
#   - building-features

# Lifecycle hooks (advanced usage)
# hooks:
#   PreToolUse:
#     - command: "echo 'About to use tool'"

# =============================================================================
# EXAMPLES
# =============================================================================

# Example 1: Read-only Explorer
# ---
# name: explorer
# description: Quickly explores the codebase. Use for understanding code structure.
# model: haiku
# permissionMode: plan
# tools:
#   - Read
#   - Grep
#   - Glob
# prompt: |
#   You are a fast code explorer. Report findings concisely.
#   Never suggest changes, only report observations.

# Example 2: Feature Implementer
# ---
# name: implementer
# description: Implements features. Use for actual code changes.
# model: sonnet
# permissionMode: acceptEdits
# tools:
#   - Read
#   - Write
#   - Edit
#   - Grep
#   - Glob
#   - Bash
# skills:
#   - building-features
# prompt: |
#   You are a feature implementation specialist.
#   Follow existing patterns and verify changes work correctly.

# Example 3: GitHub-Integrated Developer
# ---
# name: github-developer
# description: Develops features with GitHub integration. Use for PRs and issues.
# model: sonnet
# permissionMode: acceptEdits
# tools:
#   - Read
#   - Write
#   - Edit
#   - Grep
#   - Glob
#   - Bash
#   - mcp__github__list_issues
#   - mcp__github__create_pull_request
# skills:
#   - building-features
# prompt: |
#   You are a developer with GitHub access.
#   Create PRs when work is complete.
